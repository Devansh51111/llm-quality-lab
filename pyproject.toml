[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-quality-lab"
version = "0.1.0"
description = "Local-first LLM evaluation and regression QA lab"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["evalforge*"]

[tool.setuptools.package-data]
evalforge = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
