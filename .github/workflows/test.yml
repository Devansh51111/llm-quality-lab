name: QA tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Check release gate semantics
        shell: bash
        run: |
          set +e
          python -m evalforge run --responses data/baseline.json --label 'Synthetic baseline' --out runs/baseline.json
          code=$?
          set -e
          test "$code" -eq 1
          python -m evalforge run --responses data/candidate.json --label 'Synthetic candidate' --out runs/candidate.json
          python -m evalforge compare runs/baseline.json runs/candidate.json
  promptfoo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m evalforge export-promptfoo
      - name: Execute fixture bridge (not a model benchmark)
        env:
          PROMPTFOO_DISABLE_TELEMETRY: '1'
        run: npx --yes promptfoo@0.125.1 eval -c promptfooconfig.json --no-cache --no-progress-bar
  studio:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: python tests/owner-auth-integration.py
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-browser-evidence
          path: studio/test-results/
          retention-days: 7

  ragas-offline:
    runs-on: ubuntu-24.04
    env:
      RAGAS_DO_NOT_TRACK: 'true'
      HF_HUB_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r integrations/ragas/requirements.txt
      - run: python integrations/ragas/run_offline.py --out /tmp/ragas-offline.json
      - run: python -m pytest integrations/ragas/test_offline.py -q
      - uses: actions/upload-artifact@v4
        with:
          name: ragas-offline-diagnostics
          path: /tmp/ragas-offline.json
          retention-days: 7
